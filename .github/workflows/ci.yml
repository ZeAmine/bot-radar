name: CI

on:
  push:
    # `branches` explicite : lister `tags` seul remplacerait le déclenchement
    # par défaut et la CI ne tournerait plus sur les branches.
    branches: ["**"]
    tags:
      - "v*"
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer le projet et les outils de dev
        run: pip install -c requirements.lock -e ".[dev]"

      - name: Verrou des dépendances
        run: python scripts/check_lock.py

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy app scripts/matching_diagnostics.py

      - name: Pytest
        env:
          TELEGRAM_BOT_TOKEN: "123456789:AAG_ci_test_dummy_token_abc123"
          TELEGRAM_WEBHOOK_SECRET: "ci_webhook_secret_test"
          INGEST_API_TOKEN: "ci_ingest_token_test"
          INTERNAL_API_TOKEN: "ci_internal_token_test"
        run: pytest -v

  # Les tests d'intégration tournent sur SQLite par défaut ; ce job les rejoue sur
  # PostgreSQL pour que requêtes JSON, upserts et types natifs ne divergent plus.
  test-postgres:
    runs-on: ubuntu-latest
    # Le pull d'un service GitHub Actions se produit avant les steps : une relance
    # ne peut donc pas le protéger. Le conteneur est démarré explicitement ici.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer le projet et les outils de dev
        run: pip install -c requirements.lock -e ".[dev]"

      - name: Récupérer l'image PostgreSQL avec relance bornée
        run: |
          primary=public.ecr.aws/docker/library/postgres:16-alpine
          fallback=docker.io/library/postgres:16-alpine
          attempt=0
          for image in "$primary" "$fallback" "$fallback"; do
            attempt=$((attempt + 1))
            if docker pull "$image"; then
              docker tag "$image" botradar-postgres-ci:16-alpine
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 5))
              echo "Pull PostgreSQL en échec pour $image (tentative $attempt/3), relance dans ${delay}s." >&2
              sleep "$delay"
            fi
          done
          echo "Pull PostgreSQL en échec après 3 tentatives." >&2
          exit 1

      - name: Démarrer PostgreSQL
        run: |
          docker run --pull=never -d --name botradar-postgres \
            -e POSTGRES_USER=test \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=test \
            -p 5432:5432 \
            --health-cmd "pg_isready -U test" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 5 \
            botradar-postgres-ci:16-alpine

      - name: Attendre PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}unknown{{end}}' botradar-postgres)
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs botradar-postgres
              exit 1
            fi
            sleep 2
          done
          docker logs botradar-postgres
          exit 1

      - name: Migrations sur une base PostgreSQL vierge
        env:
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test"
          TELEGRAM_BOT_TOKEN: "123456789:AAG_ci_test_dummy_token_abc123"
        run: alembic upgrade head

      - name: Tests d'intégration sur PostgreSQL
        env:
          TELEGRAM_BOT_TOKEN: "123456789:AAG_ci_test_dummy_token_abc123"
          TELEGRAM_WEBHOOK_SECRET: "ci_webhook_secret_test"
          INGEST_API_TOKEN: "ci_ingest_token_test"
          INTERNAL_API_TOKEN: "ci_internal_token_test"
          TEST_DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test"
        run: pytest tests/integration/ -v

      - name: Arrêter PostgreSQL
        if: always()
        run: docker rm -f botradar-postgres || true

  # Publier un tag affirme que tout l'historique depuis le précédent est vert :
  # un commit intermédiaire cassé n'est visible qu'au bisect si `HEAD` passe.
  history:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer le projet et les outils de dev
        run: pip install -c requirements.lock -e ".[dev]"

      - name: Historique vert
        env:
          TELEGRAM_BOT_TOKEN: "123456789:AAG_ci_test_dummy_token_abc123"
          TELEGRAM_WEBHOOK_SECRET: "ci_webhook_secret_test"
          INGEST_API_TOKEN: "ci_ingest_token_test"
          INTERNAL_API_TOKEN: "ci_internal_token_test"
        run: python scripts/check_history.py --base "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo HEAD~1)"

name: CI

on:
  push:
    # `branches` explicite : lister `tags` seul remplacerait le déclenchement
    # par défaut et la CI ne tournerait plus sur les branches.
    branches: ["**"]
    tags:
      - "v*"
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer le projet et les outils de dev
        run: pip install -c requirements.lock -e ".[dev]"

      - name: Verrou des dépendances
        run: python scripts/check_lock.py

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy app scripts/matching_diagnostics.py

      - name: Pytest
        env:
          TELEGRAM_BOT_TOKEN: "123456789:AAG_ci_test_dummy_token_abc123"
          TELEGRAM_WEBHOOK_SECRET: "ci_webhook_secret_test"
          INGEST_API_TOKEN: "ci_ingest_token_test"
          INTERNAL_API_TOKEN: "ci_internal_token_test"
        run: pytest -v

  # Les tests d'intégration tournent sur SQLite par défaut. Ce job les rejoue
  # sur PostgreSQL pour que les requêtes JSON, les upserts et les types natifs
  # ne puissent plus diverger entre les deux dialectes.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Même image officielle, sans la limite de pulls anonymes Docker Hub des runners.
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer le projet et les outils de dev
        run: pip install -c requirements.lock -e ".[dev]"

      - name: Migrations sur une base PostgreSQL vierge
        env:
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test"
          TELEGRAM_BOT_TOKEN: "123456789:AAG_ci_test_dummy_token_abc123"
        run: alembic upgrade head

      - name: Tests d'intégration sur PostgreSQL
        env:
          TELEGRAM_BOT_TOKEN: "123456789:AAG_ci_test_dummy_token_abc123"
          TELEGRAM_WEBHOOK_SECRET: "ci_webhook_secret_test"
          INGEST_API_TOKEN: "ci_ingest_token_test"
          INTERNAL_API_TOKEN: "ci_internal_token_test"
          TEST_DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test"
        run: pytest tests/integration/ -v

  # Publier un tag, c'est affirmer que tout l'historique depuis le précédent est
  # vert. Sans cette étape, un commit de milieu de série peut casser alors que
  # `HEAD` passe : le défaut n'apparaît qu'au moment d'un bisect.
  history:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer le projet et les outils de dev
        run: pip install -c requirements.lock -e ".[dev]"

      - name: Historique vert
        env:
          TELEGRAM_BOT_TOKEN: "123456789:AAG_ci_test_dummy_token_abc123"
          TELEGRAM_WEBHOOK_SECRET: "ci_webhook_secret_test"
          INGEST_API_TOKEN: "ci_ingest_token_test"
          INTERNAL_API_TOKEN: "ci_internal_token_test"
        run: python scripts/check_history.py --base "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo HEAD~1)"

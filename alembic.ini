[alembic]
script_location = alembic

file_template = %%(rev)s_%%(slug)s

timezone = UTC

truncate_slug_length = 40

# %(here)s : dossier du fichier alembic.ini, indépendant du répertoire courant.
version_locations = %(here)s/alembic/versions

output_encoding = utf-8

sqlalchemy.url = postgresql+asyncpg://radar_user:radar_password@localhost:5432/radar_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
